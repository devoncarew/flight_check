name: Flutter
permissions: read-all

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Run daily against the latest Flutter stable to catch breaking changes in
  # new releases.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devoncarew/setup-flutter-action@v1
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter test
